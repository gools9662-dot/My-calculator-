<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>হিসাব</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e86">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#e8eef0; --panel:#f7fafb; --ink:#12303a; --muted:#5d7780;
  --key:#ffffff; --key-ink:#12303a; --op:#cfe3e8; --op-ink:#0b4a5c;
  --clear:#f6d9d3; --clear-ink:#8a2d1c; --eq:#0b6e86; --eq-ink:#ffffff; --line:#c5d6db;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1c20; --panel:#16272c; --ink:#e3f0f3; --muted:#8ea9b1;
    --key:#1d3238; --key-ink:#e3f0f3; --op:#254651; --op-ink:#bfe6f0;
    --clear:#4a2a25; --clear-ink:#ffc9bd; --eq:#2aa3c0; --eq-ink:#04222b; --line:#2b444b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1c20; --panel:#16272c; --ink:#e3f0f3; --muted:#8ea9b1;
  --key:#1d3238; --key-ink:#e3f0f3; --op:#254651; --op-ink:#bfe6f0;
  --clear:#4a2a25; --clear-ink:#ffc9bd; --eq:#2aa3c0; --eq-ink:#04222b; --line:#2b444b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Bengali","Kalpurush","Siyam Rupali","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;align-items:flex-start;padding:16px}
.app{width:100%;max-width:380px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.screen{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-height:130px;
  display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}
.hist{font-size:13px;color:var(--muted);max-height:48px;overflow:hidden;line-height:1.5}
.expr{font-size:20px;color:var(--muted);min-height:28px;word-break:break-all}
.res{font-size:44px;font-weight:700;line-height:1.15;word-break:break-all;min-height:52px}
.res.small{font-size:24px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.keys button{border:0;border-radius:14px;height:64px;font:inherit;font-size:26px;font-weight:600;
  background:var(--key);color:var(--key-ink);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.keys button:active{transform:scale(.96)}
.keys button:focus-visible,.top button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.keys .op{background:var(--op);color:var(--op-ink)}
.keys .clr{background:var(--clear);color:var(--clear-ink)}
.keys .eq{background:var(--eq);color:var(--eq-ink)}
.keys .wide{grid-column:span 2}
@media (prefers-reduced-motion:reduce){.keys button:active{transform:none}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>হিসাব</h1>
    <button id="lang" type="button" aria-label="সংখ্যার ভাষা বদলান">English সংখ্যা</button>
  </div>
  <section class="screen" aria-live="polite">
    <div class="hist" id="hist"></div>
    <div class="expr" id="expr"></div>
    <div class="res" id="res">০</div>
  </section>
  <div class="keys" id="keys">
    <button class="clr" data-k="C">C</button>
    <button class="op" data-k="back" aria-label="মুছুন">⌫</button>
    <button class="op" data-k="%">%</button>
    <button class="op" data-k="÷" aria-label="ভাগ">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×" aria-label="গুণ">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−" aria-label="বিয়োগ">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="যোগ">+</button>
    <button data-k="0" class="wide">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="ফলাফল">=</button>
  </div>
</main>
<script>
(function(){
  var expr="", justEq=false, bn=true, history=[];
  var BN="০১২৩৪৫৬৭৮৯";
  var $expr=document.getElementById("expr"), $res=document.getElementById("res"), $hist=document.getElementById("hist");
  var OPS="+−×÷";

  function fmt(s){
    return bn ? String(s).replace(/[0-9]/g,function(d){return BN[d]}) : String(s);
  }
  // নিরাপদ পার্সার (eval ছাড়া)
  function evaluate(src){
    var s=src.replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/"), i=0;
    function peek(){return s[i]}
    function num(){
      var st=i;
      while(i<s.length && /[0-9.]/.test(s[i])) i++;
      if(st===i) throw new Error("x");
      var v=parseFloat(s.slice(st,i));
      if(isNaN(v)) throw new Error("x");
      while(peek()==="%"){v=v/100;i++}
      return v;
    }
    function unary(){
      if(peek()==="-"){i++;return -unary()}
      if(peek()==="+"){i++;return unary()}
      return num();
    }
    function term(){
      var v=unary();
      while(peek()==="*"||peek()==="/"){
        var o=s[i++], r=unary();
        if(o==="/"){ if(r===0) throw new Error("div0"); v=v/r } else v=v*r;
      }
      return v;
    }
    function sum(){
      var v=term();
      while(peek()==="+"||peek()==="-"){
        var o=s[i++], r=term();
        v = o==="+" ? v+r : v-r;
      }
      return v;
    }
    var out=sum();
    if(i<s.length) throw new Error("x");
    return out;
  }
  function clean(v){
    if(!isFinite(v)) throw new Error("x");
    var r=parseFloat(v.toPrecision(12));
    return String(r);
  }
  function tryEval(){
    var e=expr.replace(/[+−×÷.]+$/,"");
    if(!e) return null;
    try{ return clean(evaluate(e)) }catch(err){ return err.message==="div0" ? "div0" : null }
  }
  function render(){
    var live=tryEval();
    $expr.textContent=fmt(expr);
    $res.classList.remove("small");
    if(live==="div0"){ $res.textContent="শূন্য দিয়ে ভাগ হয় না"; $res.classList.add("small") }
    else if(live===null) $res.textContent=fmt("0");
    else $res.textContent=fmt(live);
    $hist.innerHTML="";
    history.slice(-2).forEach(function(h){
      var d=document.createElement("div"); d.textContent=fmt(h); $hist.appendChild(d);
    });
  }
  function press(k){
    var last=expr.slice(-1);
    if(/[0-9]/.test(k)){
      if(justEq){expr="";justEq=false}
      expr+=k;
    } else if(k==="."){
      if(justEq){expr="";justEq=false}
      var seg=expr.split(/[+−×÷]/).pop();
      if(seg.indexOf(".")===-1) expr+= (seg===""||/[+−×÷]$/.test(expr)) ? "0." : ".";
    } else if(OPS.indexOf(k)>-1){
      justEq=false;
      if(expr===""){ if(k==="−") expr="−"; return render() }
      if(OPS.indexOf(last)>-1 && expr.length>1) expr=expr.slice(0,-1)+k;
      else if(OPS.indexOf(last)===-1) expr+=k;
    } else if(k==="%"){
      if(/[0-9%]$/.test(expr)) expr+="%";
      justEq=false;
    } else if(k==="C"){ expr=""; justEq=false }
    else if(k==="back"){ expr=expr.slice(0,-1); justEq=false }
    else if(k==="="){
      var v=tryEval();
      if(v!==null && v!=="div0"){
        history.push(expr+" = "+v);
        expr=v.replace("-","−"); justEq=true;
      }
    }
    render();
  }
  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(b) press(b.getAttribute("data-k"));
  });
  document.getElementById("lang").addEventListener("click",function(){
    bn=!bn;
    this.textContent = bn ? "English সংখ্যা" : "বাংলা সংখ্যা";
    // কীপ্যাডের সংখ্যাও বদলান
    document.querySelectorAll(".keys button").forEach(function(b){
      var k=b.getAttribute("data-k");
      if(/^[0-9]$/.test(k)) b.textContent=fmt(k);
    });
    render();
  });
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(/^[0-9]$/.test(k)||k==="."||k==="%") press(k);
    else if(k==="+") press("+");
    else if(k==="-") press("−");
    else if(k==="*"||k==="x"||k==="X") press("×");
    else if(k==="/"){e.preventDefault();press("÷")}
    else if(k==="Enter"||k==="="){e.preventDefault();press("=")}
    else if(k==="Backspace") press("back");
    else if(k==="Escape"||k==="Delete") press("C");
  });
  // শুরুতে বাংলা সংখ্যা
  document.querySelectorAll(".keys button").forEach(function(b){
    var k=b.getAttribute("data-k");
    if(/^[0-9]$/.test(k)) b.textContent=fmt(k);
  });
  render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
